<mat-toolbar color="primary" class="navbar">

    <!-- Sección izquierda -->
    <div class="left-section">

        @if (responsive.isHandset$| async) {
        <button mat-icon-button class="menu-btn" (click)="toggleMenu()">
            <mat-icon>{{menuAbierto ? 'close' : 'menu'}}</mat-icon>
        </button>
        }

        <span class="logo" routerLink="/categorias">
            <mat-icon>construction</mat-icon>

            <span>Milotuercas</span>
        </span>

    </div>

    <!-- Navegación escritorio -->
    @if (!(responsive.isHandset$| async)) {

    <div class="nav-links">
        <button mat-button routerLink="/carrito" (click)="toggleMenu()">Sobre Nosotros</button>
        <button mat-button routerLink="/productos" (click)="toggleMenu()">Productos</button>
        <button mat-button routerLink="/contacto" (click)="toggleMenu()">Contáctanos</button>
    </div>

    }

    <!-- Iconos -->
    <div class="icono-btns">

        <button mat-icon-button class="icono-btn carrito-btn" routerLink="/carrito"
            [matBadge]="cantidadProductos$ | async">

            <mat-icon>shopping_cart</mat-icon>

        </button>

        <button mat-icon-button class="icono-btn" routerLink="/iniciar-sesion">

            <mat-icon>account_circle</mat-icon>

        </button>

    </div>

</mat-toolbar>

@if (menuAbierto && (responsive.isHandset$ | async)) {
<div class="mobile-menu">
    <button mat-button routerLink="/carrito" (click)="toggleMenu()">Sobre Nosotros</button>
    <button mat-button routerLink="/productos" (click)="toggleMenu()">Productos</button>
    <button mat-button routerLink="/contacto" (click)="toggleMenu()">Contáctanos</button>
</div>
}
