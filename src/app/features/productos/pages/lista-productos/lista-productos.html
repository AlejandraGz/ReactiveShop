<div class="page lista-productos">

    @if (responsive.isHandset$ | async) {

    <div class="filtros">
        <button mat-icon-button class="filter-btn" (click)="toggleFiltros()">
            <mat-icon>{{ filtrosAbiertos ? 'close' : 'filter_list' }}</mat-icon>
            <span>Filtrar</span>
        </button>
    </div>
    }


    @if (!(responsive.isHandset$ | async)) {

    <app-filtros-productos [mostrarFiltroCategoria]="(mostrarFiltroCategoria$ | async) ?? true"
        [marcas]="marcasFiltradas$ | async" (producto)="actualizarProducto($event)"
        (categoria)="actualizarCategoria($event)" (marca)="actualizarMarca($event)"
        (precioMin)="actualizarPrecioMin($event)" (precioMax)="actualizarPrecioMax($event)" (cerrar)="cerrarFiltros()">
    </app-filtros-productos>
    }
    <div class="productos">

        @for (producto of productos$ | async; track producto.id) {
        <app-card-producto [producto]="producto" />
        }

    </div>

</div>
@if (filtrosAbiertos && (responsive.isHandset$ | async)) {

<div class="filtrosMobile">

    <app-filtros-productos [mostrarFiltroCategoria]="(mostrarFiltroCategoria$ | async) ?? true"
        [marcas]="marcasFiltradas$ | async" (producto)="actualizarProducto($event)"
        (categoria)="actualizarCategoria($event)" (marca)="actualizarMarca($event)"
        (precioMin)="actualizarPrecioMin($event)" (precioMax)="actualizarPrecioMax($event)" (cerrar)="cerrarFiltros()">
    </app-filtros-productos>

</div>
}
